services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mas_dev_password}
      POSTGRES_DB: mas_backend
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas_backend"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
